global:
  path_to_cache: "/content/combined_cache"      # path to your flat cached .npz directory
  combined_npz: true    # whether activations from all models are stored together per image
  debug: 1
  exp_factor: 16  # expansion factor: latent_dim = exp_factor * input_shape
  input_shape: 768      # default/reference feature dimension (used to compute default latent_dim)
  batch_size: 16
  num_workers: 8        # DataLoader worker processes
  nb_epochs: 30
  balanced_sources: true
  curriculum_epochs: 0  # 0 disables curriculum; cross-recon active from step 1
  save_every: 5         # save a checkpoint every N epochs
  standardize: true     # standardise activations (mean=0, std=1)
  divide_norm: false    # normalise by L2 norm instead of standardising
  use_class_tokens: false
  num_tokens: 196
  latent_dim: 12288
  timestep_dim: 256           # dimension of timestep/sigma embeddings (only used if use_tide=true)
  lr: 0.0005                  # bumped from 3e-4 since the simpler architecture has no gradient-starvation
  final_lr: 1.0e-06
  weight_decay: 1.0e-05
  warmup_steps: 50            # shorter warmup for the simpler architecture

  # --- Universal SAE behaviour ---
  cls_pool_mode: none         # 'none' = per-token (start here, paired with spatial_align_to).
                              # 'mean' = pool to one vector per image (paper's per-sample setup).
  use_tide: true             # diffusion timestep modulation. Off — single-timestep run makes it a no-op.

  # --- Spatial alignment (Option B1) ---
  # When set, every model's token grid is average-pooled down to the named
  # model's native grid before encoding. DinoV2 (16x16=256) is the smallest
  # grid here, so all models will be pooled to 16x16.
  # Set to null/empty to disable (per-token DinoV2->DinoV2 self-recon only;
  # cross-model recon is then automatically skipped for mismatched grids).
  spatial_align_to: DinoV2

  device: cuda           # "cuda" or "cpu"
  run_name: ex${exp_factor}_bs${batch_size}_topk${top_k}_LR${lr}_align${spatial_align_to}_${nb_epochs}ep
  diffusion_models: ["PixArt"]   # only models that actually live in model_zoo

  # --- wandb ---
  use_wandb: true
  wandb_project: "universal-sae"
  wandb_entity:                     # your wandb username or team (leave blank for default)
  wandb_log_every: 50               # log every N training steps
viz:
  batch_size: 100
  sample_size: 5000
  set: val
sae_params:
  top_k: 64                   # K out of latent_dim=12288 -> 0.52% density per token.
                              # Lower sparsity forces features to be more selective,
                              # making it harder for each model to claim its own subspace.
  latent_align_weight: 1.0    # cosine alignment loss weight between z_src and z_tgt.
                              # Set to 0 to disable; increase to 2.0+ if partition score stays >1.
model_zoo:
  # Vision encoders
  DinoV2: { input_shape: 384,  num_tokens: 256, og_model: DinoV2 }     # 16x16 patch grid
  # Diffusion/Flow models
  PixArt: { input_shape: 1152, num_tokens: 1024, og_model: PixArt }    # 32x32 patch grid
